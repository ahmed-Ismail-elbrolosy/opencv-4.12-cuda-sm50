name: Build OpenCV 4.12 CUDA sm_50

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencv-4.12-cuda-sm50
  cancel-in-progress: false

jobs:
  build:
    name: Native Ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 360

    steps:
      - name: Check out build repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and package OpenCV
        run: ./scripts/build.sh

      - name: Generate local provenance
        run: ./scripts/provenance.sh dist

      - name: Upload versioned artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencv-4.12.0-cuda12.9-sm50-ubuntu26.04
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attest:
    name: Attest packages
    if: ${{ vars.ENABLE_GITHUB_ATTESTATION == 'true' }}
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: opencv-4.12.0-cuda12.9-sm50-ubuntu26.04
          path: dist

      - name: Attest package checksums
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Collect GitHub attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE_PATH}" github-attestation.sigstore.json

      - name: Upload GitHub attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencv-4.12.0-cuda12.9-sm50-attestation
          path: github-attestation.sigstore.json
          if-no-files-found: error
          retention-days: 14
